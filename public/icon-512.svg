<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081e2b" />
      <stop offset="100%" stop-color="#0e2a38" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="256" y1="70" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00bba2" />
      <stop offset="60%" stop-color="#00a88f" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  {/* Base Shadow */}
  <ellipse cx="256" cy="440" rx="85" ry="16" fill="#000000" opacity="0.4" />

  {/* Main Pin Shape */}
  <g filter="url(#shadow)">
    <path 
      d="M256 420C256 420 400 270 400 170C400 90.4772 335.523 26 256 26C176.477 26 112 90.4772 112 170C112 270 256 420 256 420Z" 
      fill="url(#pinGrad)" 
    />
    <!-- Inner Dark Teal Pin Detail -->
    <path
      d="M256 240C256 240 310 180 310 140C310 110.176 285.824 86 256 86C226.176 86 202 110.176 202 140C202 180 256 240 256 240Z"
      fill="#081e2b"
    />
  </g>
</svg>

